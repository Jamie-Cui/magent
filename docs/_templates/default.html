<!doctype html>
<html lang="{{lang}}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{title}} ({{site_title}})</title>
    <meta name="description" content="{{description}}">
{{head_links}}
    <link rel="alternate" hreflang="{{alternate_lang}}" href="{{alternate_href}}">
    <link rel="stylesheet" href="{{stylesheet_href}}">
  </head>
  <body>
    <a class="skip-link" href="#content">{{skip_label}}</a>
    <header class="nav-panel" aria-label="{{navigation_label}}">
{{pager}}
    </header>
    <hr>
    <main id="content" class="document">
      <h1>{{title}}</h1>
{{content}}
    </main>
    <hr>
    <footer class="nav-panel" aria-label="{{navigation_label}}">
{{pager}}
    </footer>
  </body>
</html>
